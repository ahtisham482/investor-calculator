<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Profit dashboard</title>
    <meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:,">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
    />
    <style>
      :root {
        --bg: #f7f6f1;
        --ink: #1d1c1a;
        --mute: #66635b;
        --rule: #d9d6cb;
        --wash: #eeece4;
        --field: #fffefb;
        --accent: #1f5f46;
        --loss: #a8402e;
        --serif: "Source Serif 4", Georgia, serif;
        --sans:
          "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: light;
        accent-color: var(--accent);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141412;
          --ink: #ebe8df;
          --mute: #a09d92;
          --rule: #36342f;
          --wash: #1d1c19;
          --field: #1b1a17;
          --accent: #6dbf97;
          --loss: #e58a77;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: clip;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--accent);
        text-underline-offset: 3px;
      }
      a:hover {
        color: var(--ink);
      }
      ::selection {
        background: var(--accent);
        color: var(--bg);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #app {
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-variant-numeric: tabular-nums;
      }
      .wrap {
        max-width: 1240px;
        margin: 0 auto;
      }
      .card {
        background: var(--field);
        border: 1px solid var(--rule);
        border-radius: 8px;
        min-width: 0;
      }
      .h2 {
        margin: 0;
        font: 600 17px/1.3 var(--serif);
      }
      .sub {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--mute);
      }
      .tab {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        padding: 10px 0;
        font-size: 15px;
        font-weight: 500;
        color: var(--mute);
        cursor: pointer;
        white-space: nowrap;
        flex: none;
      }
      .tab:hover {
        color: var(--ink);
      }
      .tab[aria-selected="true"] {
        color: var(--ink);
        border-bottom-color: var(--accent);
        font-weight: 600;
      }
      .pills {
        display: flex;
        gap: 2px;
        padding: 3px;
        background: var(--wash);
        border-radius: 8px;
      }
      .pill {
        border: 0;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 13.5px;
        font-weight: 500;
        background: transparent;
        color: var(--mute);
        box-shadow: none;
        cursor: pointer;
        white-space: nowrap;
      }
      .pill:hover {
        color: var(--ink);
      }
      .pill.on {
        background: var(--field);
        color: var(--ink);
        font-weight: 600;
        box-shadow:
          0 0 0 1px var(--rule),
          0 1px 2px rgba(0, 0, 0, 0.06);
      }
      .ghost {
        background: none;
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 5px 12px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }
      .ghost:hover {
        background: var(--wash);
      }
      .hov:hover {
        background: var(--wash);
      }
      tr.hov:hover th,
      tr.hov:hover td {
        background: var(--wash);
      }
      .solid {
        background: var(--ink);
        color: var(--bg);
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        font-weight: 500;
        cursor: pointer;
        min-height: 36px;
      }
      .solid:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .lnk {
        background: none;
        border: 0;
        padding: 0;
        color: var(--accent);
        font-weight: 500;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .fld {
        background: var(--bg);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 7px 10px;
        min-height: 36px;
        color: var(--ink);
      }
      .lab {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12.5px;
        color: var(--mute);
      }
      .th {
        text-align: right;
        padding: 10px 14px;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--mute);
        background: var(--field);
        border-bottom: 1px solid var(--rule);
        white-space: nowrap;
      }
      .td {
        text-align: right;
        padding: 10px 14px;
        border-bottom: 1px solid var(--rule);
        background: var(--field);
      }
      .cap {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .stl {
        cursor: pointer;
      }
      .stl:hover {
        background: var(--wash) !important;
      }
      .bar {
        flex: 1;
        position: relative;
        height: 100%;
        cursor: crosshair;
        min-width: 0;
      }
      .bar > div {
        position: absolute;
        left: 0;
        right: 0;
        border-radius: 1.5px;
        transition: opacity 0.12s;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <p style="margin: 48px 16px; color: var(--mute)">Loading orders…</p>
    </div>
    <script>
      /* Profit engine — ported from page.html (ahtisham482/profit-dashboard). Same aggregation rules. */
(function () {
  const EP = Date.UTC(2020, 0, 1);
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => new Date(EP + d * 864e5).toISOString().slice(0, 10);
  const dnum = (s) => Math.round((Date.parse(s + "T00:00:00Z") - EP) / 864e5);
  const fmtD = (d) => { const t = new Date(EP + d * 864e5); return t.getUTCDate() + " " + MON[t.getUTCMonth()]; };
  const fmtDY = (d) => fmtD(d) + " " + new Date(EP + d * 864e5).getUTCFullYear();
  const monthStart = (y, m) => Math.round((Date.UTC(y, m, 1) - EP) / 864e5);
  const dim = (ym) => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate();
  const ymLabel = (ym) => MON[+ym.slice(5, 7) - 1] + " " + ym.slice(0, 4);

  const KDESC = {
    "comp:medium": "Medium bag 50x70 cm, sold singly or inside packs",
    "comp:large": "Large bag 60x80 cm, sold singly or inside packs",
    "comp:jumbo": "Jumbo bag 80x100 cm, sold singly or inside packs",
    "comp:hand": "Manual hand pump, one unit",
    "comp:electric": "Electric vacuum pump, one unit",
    "comp:shoe": "Shoe cover, one unit",
    "pack:5": "5 mixed bags: 2 medium, 2 large, 1 jumbo, plus hand pump and shoe cover. Sells at Rs 1,999",
    "pack:7": "7 mixed bags: 3 medium, 2 large, 2 jumbo. Sells at Rs 2,799",
    "pack:9": "9 mixed bags: 3 medium, 3 large, 3 jumbo. Sells at Rs 3,299",
    "pack:12": "12 mixed bags: 4 medium, 4 large, 4 jumbo. Sells at Rs 4,499",
    "pack:5medium": "5 medium bags, all the same size, plus free hand pump and shoe cover. Sells at Rs 1,599",
    "pack:5large": "5 large bags, all the same size, plus free hand pump and shoe cover. Sells at Rs 1,999",
    "pack:5jumbo": "5 jumbo bags, all the same size, plus free hand pump and shoe cover. Sells at Rs 2,499",
    "pack:6": "6-bag pack. Mix of sizes not recorded yet, ask whoever packs these",
    "pack:8": "8-bag pack. Mix of sizes not recorded yet, ask whoever packs these",
    "pack:10": "10-bag pack. Mix of sizes not recorded yet, ask whoever packs these",
  };
  /* monthly ad spend sent 4 Nov 2026 (Meta + TikTok) */
  const ADS_BUILTIN = {
    "2026-07": { amount: 518584.9, meta: 504720.17, tiktok: 13864.73, src: "Meta 504,720.17 + TikTok 13,864.73" },
    "2026-08": { amount: 578901.95, meta: 499966.68, tiktok: 78935.27, src: "Meta 499,966.68 + TikTok 78,935.27" },
    "2026-09": { amount: 493090.53, meta: 482517.81, tiktok: 10572.72, src: "Meta 482,517.81 + TikTok 10,572.72" },
  };
  const SHOPIFY = { "2026-07": 11400, "2026-08": 11100, "2026-09": 10882 };

  function create(D, seed) {
    const ROWS = D.rows.filter((r) => r[0] >= dnum("2026-07-01") && r[0] < dnum("2026-10-01"));
    const SIGS = D.sigs;
    const KEYS = D.keys.map((k) => {
      const o = { ...k };
      if (KDESC[o.id]) { o.d = KDESC[o.id]; o.l = o.l.replace(/ \(.*\)$/, ""); }
      else if (o.t === "name") o.d = "Order name as typed in the store, no fixed pack. Cost depends on what the order contains";
      return o;
    });
    const MINDAY = ROWS[0][0], MAXDAY = ROWS[ROWS.length - 1][0];
    const cname = (k) => { const n = D.couriers[k] || "other"; return n.charAt(0).toUpperCase() + n.slice(1); };

    let costDocs = JSON.parse(JSON.stringify((seed && seed.costs) || {}));
    let adDocs = { ...ADS_BUILTIN };
    for (const id in (seed && seed.adspend) || {}) adDocs[id] = seed.adspend[id];
    let costBy = [], rowCost = [], adDaily = {}, adMonthly = {};

    function costAt(ki, day) {
      const e = costBy[ki]; if (!e) return null;
      let c = null;
      for (const x of e) { if (x.d <= day) c = x.cost; else break; }
      return c;
    }
    function rebuildCosts() {
      costBy = KEYS.map((k) => {
        const doc = costDocs[k.id];
        if (!doc || !Array.isArray(doc.entries)) return null;
        const e = doc.entries.filter((x) => x && x.from && isFinite(x.cost))
          .map((x) => ({ d: dnum(x.from), cost: +x.cost })).sort((a, b) => a.d - b.d);
        return e.length ? e : null;
      });
      const memo = new Map();
      rowCost = ROWS.map((r) => {
        const mk = r[3] + ":" + r[0];
        if (memo.has(mk)) return memo.get(mk);
        let tot = 0, ok = true;
        for (const [ki, q] of SIGS[r[3]][1]) {
          if (ki < 0) { tot += q; continue; }
          const c = costAt(ki, r[0]);
          if (c == null) { ok = false; break; }
          tot += c * q;
        }
        const v = ok ? tot : null;
        memo.set(mk, v);
        return v;
      });
    }
    function rebuildAds() {
      adDaily = {}; adMonthly = {};
      for (const id in adDocs) {
        const a = adDocs[id];
        if (!a || !isFinite(a.amount)) continue;
        if (/^\d{4}-\d{2}-\d{2}$/.test(id)) adDaily[id] = a;
        else if (/^\d{4}-\d{2}$/.test(id)) adMonthly[id] = a;
      }
    }
    /* one day's ad spend, split by platform where the split is known */
    function adsDay(d) {
      const s = iso(d);
      if (adDaily[s]) return { meta: 0, tiktok: 0, other: +adDaily[s].amount, total: +adDaily[s].amount };
      const ym = s.slice(0, 7), a = adMonthly[ym];
      if (!a) return { meta: 0, tiktok: 0, other: 0, total: 0 };
      const n = dim(ym), meta = (+a.meta || 0) / n, tiktok = (+a.tiktok || 0) / n, total = +a.amount / n;
      return { meta, tiktok, other: Math.max(0, total - meta - tiktok), total };
    }
    const shopDay = (d) => { const ym = iso(d).slice(0, 7); return SHOPIFY[ym] ? SHOPIFY[ym] / dim(ym) : 0; };

    const newA = () => ({ del: 0, delAll: 0, ret: 0, unset: 0, nocost: 0, both: 0, cod: 0, pre: 0, preN: 0, kup: 0, kupN: 0, dc: 0, fuel: 0, gst: 0, wht: 0, retLoss: 0, pc: 0, ads: 0, shop: 0 });
    function addRow(a, r, c) {
      if (r[1] === 0) {
        a.delAll++;
        const un = !r[9], nc = c == null;
        if (un) a.unset++;
        if (nc) a.nocost++;
        if (un && nc) a.both++;
        if (!un && !nc) {
          a.del++; a.cod += r[4];
          if (r[10]) { a.pre += r[4]; a.preN++; }
          if (r[11]) { a.kup += r[4]; a.kupN++; }
          a.dc += r[5]; a.fuel += r[6]; a.gst += r[7]; a.wht += r[8]; a.pc += c;
        }
      } else if (r[1] === 1) { a.ret++; a.retLoss += r[5] + r[6] + r[7] + r[8]; }
    }
    const chg = (a) => a.dc + a.fuel + a.gst + a.wht;
    const netOf = (a) => a.cod - chg(a) - a.retLoss - a.pc - a.ads - a.shop;

    function buildCols(from, to, g) {
      const cols = [];
      if (g === "day") {
        for (let d = from; d <= to; d++) cols.push({ a: d, b: d, l: fmtD(d), s: WD[(d + 2) % 7] });
      } else if (g === "week") {
        for (let ws = from - ((from + 2) % 7); ws <= to; ws += 7) {
          const a = Math.max(ws, from), b = Math.min(ws + 6, to);
          cols.push({ a, b, l: fmtD(a), s: a === b ? "" : "to " + fmtD(b) });
        }
      } else {
        let d = from;
        while (d <= to) {
          const t = new Date(EP + d * 864e5), y = t.getUTCFullYear(), m = t.getUTCMonth();
          const end = monthStart(y, m + 1) - 1, b = Math.min(end, to);
          cols.push({ a: d, b, l: MON[m] + " " + y, s: d === monthStart(y, m) && b === end ? "" : fmtD(d) + " to " + fmtD(b) });
          d = b + 1;
        }
      }
      cols.forEach((c) => (c.A = newA()));
      return cols;
    }
    function compute(from, to, g, full) {
      const cols = buildCols(from, to, g), dayCol = new Int32Array(to - from + 1);
      cols.forEach((c, i) => { for (let d = c.a; d <= c.b; d++) dayCol[d - from] = i; });
      const tot = newA(), byP = {}, byC = {};
      for (let i = 0; i < ROWS.length; i++) {
        const r = ROWS[i];
        if (r[0] < from || r[0] > to) continue;
        const c = rowCost[i];
        addRow(cols[dayCol[r[0] - from]].A, r, c);
        addRow(tot, r, c);
        if (full) {
          addRow(byC[r[2]] || (byC[r[2]] = newA()), r, c);
          const g2 = SIGS[r[3]][0];
          addRow(byP[g2] || (byP[g2] = newA()), r, c);
        }
      }
      const adsPlat = { meta: 0, tiktok: 0, other: 0 }, adsMonth = {}, shopMonth = {};
      cols.forEach((c) => {
        let s = 0, sh = 0;
        for (let d = c.a; d <= c.b; d++) {
          const ad = adsDay(d), sd = shopDay(d);
          s += ad.total; sh += sd;
          if (full) {
            adsPlat.meta += ad.meta; adsPlat.tiktok += ad.tiktok; adsPlat.other += ad.other;
            const ym = iso(d).slice(0, 7);
            const am = adsMonth[ym] || (adsMonth[ym] = { meta: 0, tiktok: 0, other: 0, total: 0, days: 0 });
            am.meta += ad.meta; am.tiktok += ad.tiktok; am.other += ad.other; am.total += ad.total; am.days++;
            const smo = shopMonth[ym] || (shopMonth[ym] = { v: 0, days: 0 });
            smo.v += sd; smo.days++;
          }
        }
        c.A.ads = s; tot.ads += s; c.A.shop = sh; tot.shop += sh;
        c.net = netOf(c.A);
      });
      return { cols, tot, byP, byC, adsPlat, adsMonth, shopMonth };
    }

    /* costs tab */
    const delCount = KEYS.map(() => 0), codSum = KEYS.map(() => 0), codN = KEYS.map(() => 0);
    ROWS.forEach((r) => {
      if (r[1] === 0) {
        const parts = SIGS[r[3]][1];
        for (const [ki] of parts) if (ki >= 0) delCount[ki]++;
        if (parts.length === 1 && parts[0][0] >= 0 && parts[0][1] === 1) { codSum[parts[0][0]] += r[4]; codN[parts[0][0]]++; }
      }
    });
    const N = (v) => Math.round(v).toLocaleString("en-US");
    function costHint(i) {
      let h = "";
      if (codN[i] >= 5) h += `Usually sold for about Rs ${N(codSum[i] / codN[i])}. `;
      if (KEYS[i].t === "pack") {
        const known = KEYS.map((k, j) => ({ k, j })).filter((x) => x.k.t === "pack" && costAt(x.j, MAXDAY) != null)
          .slice(0, 5).map((x) => `${x.k.l.replace(" pack", "")} Rs ${N(costAt(x.j, MAXDAY))}`);
        if (known.length) h += "Packs with a known cost: " + known.join(", ") + ". ";
      }
      h += KEYS[i].t === "comp" ? "Enter the cost of one unit." : KEYS[i].t === "pack" ? "Enter the cost of one complete pack, everything in the box." : "Enter the cost of one whole order like this.";
      return h;
    }
    function needList() {
      const idx = KEYS.map((_, i) => i).filter((i) => !costBy[i] && delCount[i] > 0);
      const rank = (i) => (KEYS[i].t === "pack" ? 0 : KEYS[i].t === "comp" ? 1 : 2);
      return idx.sort((a, b) => rank(a) - rank(b) || delCount[b] - delCount[a])
        .map((i) => ({ i, label: KEYS[i].l, desc: KEYS[i].d || "", waiting: delCount[i], hint: costHint(i) }));
    }
    const ITEMS = KEYS.map((_, i) => i).filter((i) => KEYS[i].t !== "name");
    function items(today) {
      return ITEMS.map((i) => {
        const e = costBy[i], last = e ? e[e.length - 1] : null, now = costAt(i, today);
        return { i, label: KEYS[i].l, desc: KEYS[i].d || "", type: KEYS[i].t, cost: now, since: last ? (last.d <= dnum("2000-01-02") ? "the start" : fmtDY(last.d)) : null };
      });
    }
    function setCost(i, v, from) {
      const id = KEYS[i].id, prev = (costDocs[id] && costDocs[id].entries) || [];
      const entries = prev.filter((x) => x.from !== from).concat([{ from, cost: v }]).sort((a, b) => (a.from < b.from ? -1 : 1));
      costDocs[id] = { key: id, label: KEYS[i].l, entries, by: "you", at: new Date().toISOString() };
      rebuildCosts();
    }
    function setAd(period, amount) {
      adDocs[period] = { period, amount, by: "you", at: new Date().toISOString() };
      rebuildAds();
    }
    function adList() {
      return Object.keys(adDocs).sort().reverse().map((id) => {
        const a = adDocs[id];
        return { id, month: id.length === 7, when: id.length === 7 ? ymLabel(id) : fmtDY(dnum(id)), amount: +a.amount, meta: a.meta != null ? +a.meta : null, tiktok: a.tiktok != null ? +a.tiktok : null };
      });
    }
    function latest() {
      let best = null;
      for (const col of [costDocs, adDocs]) for (const id in col) {
        const d = col[id];
        if (d && d.at && (!best || d.at > best.at)) best = { at: d.at, by: d.by || null, src: d.src || "" };
      }
      return best;
    }
    /* replace saved costs and ad spend with what the Worker returned; saved ad spend for a month replaces the built-in figure */
    function load(data) {
      costDocs = JSON.parse(JSON.stringify((data && data.costs) || {}));
      adDocs = { ...ADS_BUILTIN };
      for (const id in (data && data.adspend) || {}) adDocs[id] = data.adspend[id];
      rebuildCosts(); rebuildAds();
    }
    rebuildCosts(); rebuildAds();
    return { load,  ROWS, KEYS, MINDAY, MAXDAY, compute, chg, netOf, cname, groups: D.groups, couriers: D.couriers, needList, items, setCost, setAd, adList, latest, costAt };
  }
  window.PDEngine = { create, MON, WD, iso, dnum, fmtD, fmtDY, monthStart, dim, ymLabel };
})();

    </script>
    <script>

    : "minmax(0,1fr) 130px 84px 96px";
  const itCols = narrow
    ? "minmax(0,1fr) auto 50px"
    : "minmax(0,1fr) minmax(80px,200px) 110px 60px";
  const pctCell = (x) =>
    narrow
      ? ""
      : `<span style="text-align:right;font-size:13.5px;color:var(--mute)">${x}</span>`;
  const dCell = (d) =>
    `<span style="text-align:right;font-size:13px;font-weight:600;color:${d.color};white-space:nowrap">${d.text}</span>`;
  const mkItems = (arr, total, keep) => {
    arr = arr.filter((x) => Math.abs(x.v) >= 0.5);
    if (!keep) arr.sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
    const head = arr.slice(0, 8),
      rest = arr.slice(8);
    if (rest.length)
      head.push({
        n: rest.length + " other products",
        v: rest.reduce((s, x) => s + x.v, 0),
        sub: "",
      });
    return head.map((x) => ({
      name: x.n,
      sub: x.sub || "",
      value: N(x.v),
      share: total ? pct(x.v / total) : "",
      bar:
        (total
          ? Math.min(100, (Math.abs(x.v) / Math.abs(total)) * 100)
          : 0
        ).toFixed(1) + "%",
    }));
  };
  const line = (key, label, hint, v, pv, isCost, note) => {
    const o = isOpen(key),
      vw = VIEWS[key],
      vk = st.view[key] || Object.keys(vw)[0],
      d = delta(v, pv, !isCost);
    const [, fn, keep] = vw[vk];
    let h = `<div><div class="stl" data-act="line" data-arg="${key}" role="button" tabindex="0" aria-expanded="${o}" style="display:grid;grid-template-columns:${stCols};gap:0 16px;align-items:baseline;padding:13px 20px;border-top:1px solid var(--rule);background:${o ? "var(--wash)" : "transparent"}">
      <div style="display:flex;gap:10px;align-items:baseline;min-width:0"><span style="display:inline-block;width:12px;flex:none;color:var(--mute);font-size:13px;transform:rotate(${o ? "90deg" : "0deg"});transition:transform .15s">›</span>
      <div style="min-width:0;flex:1"><div style="font-size:15px;font-weight:500">${esc(label)}</div><div style="font-size:12.5px;color:var(--mute);line-height:1.4">${esc(hint)}</div></div></div>
      <span style="text-align:right;font-size:16px;white-space:nowrap">${isCost ? acct(-v) : acct(v)}</span>${pctCell(T.cod ? pct(v / T.cod) : "")}${dCell(d)}</div>`;
    if (o) {
      h +=
        `<div style="padding:2px 20px 16px ${narrow ? "20px" : "42px"};background:var(--wash)">
        <div style="display:inline-flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--rule);border-radius:7px;max-width:100%;overflow-x:auto;margin:6px 0 10px">` +
        Object.keys(vw)
          .map((k) =>
            pill(
              k === vk,
              "view",
              key + "|" + k,
              vw[k][0],
              "border-radius:5px;padding:4px 10px;font-size:12.5px",
            ),
          )
          .join("") +
        `</div>` +
        mkItems(fn(), v, keep)
          .map(
            (it) =>
              `<div style="display:grid;grid-template-columns:${itCols};gap:4px 14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)">
          <div style="min-width:0"><div style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}</div><div style="font-size:12px;color:var(--mute)">${esc(it.sub)}</div></div>` +
              (narrow
                ? ""
                : `<div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden"><div style="height:100%;width:${it.bar};background:${isCost ? LOSS : ACC};border-radius:3px"></div></div>`) +
              `<span style="text-align:right;font-size:14px;white-space:nowrap">${it.value}</span><span style="text-align:right;font-size:12.5px;color:var(--mute)">${it.share}</span></div>`,
          )
          .join("") +
        (note
          ? `<p style="margin:10px 0 0;font-size:12.5px;color:var(--mute)">${esc(note)}</p>`
          : "") +
        `</div>`;
    }
    return h + `</div>`;
  };
  const subRow = (
    label,
    v,
    pv,
  ) => `<div style="display:grid;grid-template-columns:${stCols};gap:0 16px;align-items:baseline;padding:11px 20px;border-top:1px solid var(--rule);background:var(--wash)">
    <span style="padding-left:22px;font-size:15px;font-weight:600">${label}</span><span style="text-align:right;font-size:16px;font-weight:600;white-space:nowrap">${acct(v)}</span>${pctCell(T.cod ? pct(v / T.cod) : "")}${dCell(delta(v, pv, true))}</div>`;
  const notes = [];
  if (T.preN)
    notes.push(
      N(T.preN) +
        " prepaid orders (PayFast and WhatsApp) are estimated from list prices.",
    );
  if (T.kupN)
    notes.push(
      N(T.kupN) +
        " KourierUp orders: cash handed over by our rider but not yet updated in the app; fees estimated at the usual KourierUp rate.",
    );
  const gp = T.cod - chg(T) - T.pc,
    pgp = PT ? PT.cod - chg(PT) - PT.pc : null;
  const anyClosed = KEYS6.some((k) => !isOpen(k));
  return (
    `<section class="card" style="overflow:hidden">
    <div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;padding:18px 20px 14px">
      <div style="flex:1 1 280px"><h2 class="h2">Income statement</h2><p class="sub">Open any line to see its breakdown. Costs in brackets.</p></div>
      <button type="button" class="ghost" data-act="toggleAll">${anyClosed ? "Expand all" : "Collapse all"}</button></div>
    <div class="cap" style="display:grid;grid-template-columns:${stCols};gap:0 16px;padding:8px 20px;border-top:1px solid var(--ink)">
      <span>Rs</span><span style="text-align:right">Amount</span>${narrow ? "" : `<span style="text-align:right">% of rev.</span>`}<span style="text-align:right">vs prev.</span></div>` +
    line(
      "revenue",
      "Revenue",
      N(T.del) + " delivered orders, cash on delivery and prepaid",
      T.cod,
      PT && PT.cod,
      false,
      notes.join(" "),
    ) +
    line(
      "fees",
      "Courier & handling fees",
      "Delivery, fuel surcharge, GST and WHT on delivered orders",
      chg(T),
      PT && chg(PT),
      true,
    ) +
    line(
      "cogs",
      "Cost of goods sold",
      "Landed cost of items in delivered orders",
      T.pc,
      PT && PT.pc,
      true,
    ) +
    subRow("Gross profit", gp, pgp) +
    line(
      "returns",
      "Return losses",
      N(T.ret) + " returned orders. Stock is recovered, courier fees are lost",
      T.retLoss,
      PT && PT.retLoss,
      true,
    ) +
    line(
      "ads",
      "Advertising",
      "Meta and TikTok, monthly spend spread evenly over its days",
      T.ads,
      PT && PT.ads,
      true,
    ) +
    line(
      "shop",
      "Shopify",
      "Monthly plan, spread evenly over its days",
      T.shop,
      PT && PT.shop,
      true,
    ) +
    `<div style="display:grid;grid-template-columns:${stCols};gap:0 16px;align-items:baseline;padding:16px 20px 18px;border-top:2px solid var(--ink)">
      <span style="padding-left:22px;font:600 18px/1.2 var(--serif)">Net profit</span><span style="text-align:right;font-size:20px;font-weight:600;white-space:nowrap;color:${net < 0 ? LOSS : INK}">${acct(net)}</span>${pctCell(T.cod ? pct(net / T.cod) : "")}${dCell(delta(net, pnet, true))}</div></section>`
  );
}

/* ---------- products ---------- */
function products({ st, cur, T }) {
  const cols = [
    ["name", "Product", "left"],
    ["orders", "Orders"],
    ["rev", "Revenue"],
    ["profit", "Profit before ads"],
    ["per", "Per order"],
    ["margin", "Margin"],
    ["ret", "Returns"],
    ["rr", "Return rate"],
  ];
  const rows = Object.keys(cur.byP)
    .map((k) => {
      const A = cur.byP[k],
        p = prof(A);
      return {
        name: E.groups[k],
        orders: A.del,
        ret: A.ret,
        rr: rr(A) ?? -1,
        rev: A.cod,
        profit: p,
        per: A.del ? p / A.del : -1e9,
        margin: A.cod ? p / A.cod : -1e9,
      };
    })
    .filter((x) => x.orders > 0 || x.ret > 0);
  const { k: sk, dir } = st.psort;
  rows.sort((a, b) =>
    sk === "name"
      ? dir * String(a.name).localeCompare(b.name)
      : dir * (a[sk] - b[sk]),
  );
  const pm = Math.max(1, ...rows.map((x) => Math.abs(x.profit)));
  const tp = prof(T);
  const td = (x) => `<td class="td">${x}</td>`;
  return (
    `<section class="card" style="overflow:hidden"><div style="padding:18px 20px 14px"><h2 class="h2">Profit by product</h2>
    <p class="sub">Profit is before advertising and Shopify, which are not split by product. Click a column to sort.</p></div>
    <div style="overflow-x:auto;border-top:1px solid var(--ink)"><table style="border-collapse:separate;border-spacing:0;width:100%;font-size:14px"><thead><tr>` +
    cols
      .map(
        ([k, l, al], i) =>
          `<th class="th" scope="col" data-act="psort" data-arg="${k}" aria-sort="${sk === k ? (dir < 0 ? "descending" : "ascending") : "none"}" tabindex="0" style="position:${i === 0 ? "sticky" : "static"};left:0;z-index:${i === 0 ? 2 : 0};text-align:${al || "right"};color:${sk === k ? INK : MUTE};cursor:pointer;user-select:none">${l}${sk === k ? (dir < 0 ? " ↓" : " ↑") : ""}</th>`,
      )
      .join("") +
    `</tr></thead><tbody>` +
    (rows.length
      ? ""
      : `<tr><th class="td" colspan="8" style="text-align:left;color:var(--mute)">No orders counted for this period yet</th></tr>`) +
    rows
      .map(
        (x) =>
          `<tr class="hov"><th class="td" scope="row" style="position:sticky;left:0;z-index:1;text-align:left;font-weight:500;white-space:nowrap;max-width:15rem;overflow:hidden;text-overflow:ellipsis" title="${esc(x.name)}">${esc(x.name)}</th>` +
          td(x.orders ? N(x.orders) : "–") +
          td(acct(x.rev)) +
          `<td class="td" style="min-width:190px"><div style="display:flex;gap:10px;align-items:center;justify-content:flex-end"><div style="flex:1;max-width:90px;height:6px;background:var(--wash);border-radius:3px;overflow:hidden"><div style="height:100%;width:${((Math.abs(x.profit) / pm) * 100).toFixed(1)}%;background:${x.profit < 0 ? LOSS : ACC}"></div></div><span style="font-weight:600;color:${x.profit < 0 ? LOSS : INK};white-space:nowrap">${acct(x.profit)}</span></div></td>` +
          td(x.per > -1e9 ? N(x.per) : "–") +
          td(x.margin > -1e9 ? pct(x.margin) : "–") +
          td(x.ret ? N(x.ret) : "–") +
          td(x.rr >= 0 ? pct(x.rr) : "–") +
          `</tr>`,
      )
      .join("") +
    `<tr><th style="position:sticky;left:0;z-index:1;background:var(--wash);text-align:left;padding:11px 14px;font-weight:600;border-top:1px solid var(--ink)">Total</th>` +
    [
      N(T.del),
      acct(T.cod),
      acct(tp),
      T.del ? N(tp / T.del) : "–",
      T.cod ? pct(tp / T.cod) : "–",
      N(T.ret),
      pct(rr(T)),
    ]
      .map(
        (c) =>
          `<td style="text-align:right;padding:11px 14px;font-weight:600;background:var(--wash);border-top:1px solid var(--ink);white-space:nowrap">${c}</td>`,
      )
      .join("") +
    `</tr></tbody></table></div></section>`
  );
}

/* ---------- couriers ---------- */
function couriers({ cur }) {
  const cs = Object.keys(cur.byC)
    .map((k) => {
      const A = cur.byC[k],
        p = prof(A);
      return {
        name: E.cname(k),
        A,
        p,
        tot: A.delAll + A.ret,
        ppo: A.del ? p / A.del : 0,
      };
    })
    .sort((a, b) => b.tot - a.tot);
  const mt = Math.max(1, ...cs.map((c) => c.tot)),
    mp = Math.max(1, ...cs.map((c) => Math.abs(c.ppo)));
  const row = (name, bar, top, bottom) =>
    `<div style="display:grid;grid-template-columns:88px minmax(0,1fr) 92px;gap:12px;align-items:center"><span style="font-size:14px;font-weight:500">${esc(name)}</span>${bar}<div style="text-align:right;line-height:1.25"><div style="font-size:13.5px;font-weight:600">${top}</div><div style="font-size:12px;color:var(--mute)">${bottom}</div></div></div>`;
  const none = cs.length
    ? ""
    : `<p style="margin:0;color:var(--mute)">No orders in this period.</p>`;
  const key = (c, l) =>
    `<span style="display:flex;gap:6px;align-items:center"><span style="width:10px;height:10px;border-radius:2px;background:${c}"></span>${l}</span>`;
  const td = (x, s) => `<td class="td"${s ? ` style="${s}"` : ""}>${x}</td>`;
  return (
    `<div style="display:flex;flex-direction:column;gap:14px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px">
    <section class="card" style="padding:18px 20px 18px"><h2 class="h2">Volume and returns</h2>
      <div style="display:flex;gap:16px;margin:4px 0 16px;font-size:12.5px;color:var(--mute)">${key(ACC, "Delivered")}${key(LOSS, "Returned")}</div>
      <div style="display:flex;flex-direction:column;gap:14px">${none}` +
    cs
      .map((c) =>
        row(
          c.name,
          `<div style="display:flex;height:14px;border-radius:2px;overflow:hidden;background:var(--wash)"><div style="width:${((c.A.delAll / mt) * 100).toFixed(1)}%;background:var(--accent)"></div><div style="width:${((c.A.ret / mt) * 100).toFixed(1)}%;background:var(--loss)"></div></div>`,
          N(c.tot) + " orders",
          pct(rr(c.A)) + " returned",
        ),
      )
      .join("") +
    `</div></section><section class="card" style="padding:18px 20px 18px"><h2 class="h2">Profit before ads, per delivered order</h2>
      <p style="margin:2px 0 16px;font-size:12.5px;color:var(--mute)">Revenue minus courier fees, COGS and return losses, divided by delivered orders.</p>
      <div style="display:flex;flex-direction:column;gap:14px">${none}` +
    cs
      .map((c) =>
        row(
          c.name,
          `<div style="height:14px;border-radius:2px;background:var(--wash);overflow:hidden"><div style="height:100%;width:${((Math.abs(c.ppo) / mp) * 100).toFixed(1)}%;background:${c.ppo < 0 ? LOSS : ACC}"></div></div>`,
          c.A.del ? "Rs " + N(c.ppo) : "–",
          "fees " + (c.A.del ? "Rs " + N(chg(c.A) / c.A.del) : "–"),
        ),
      )
      .join("") +
    `</div></section></div>
    <section class="card" style="overflow:hidden"><div style="padding:18px 20px 14px"><h2 class="h2">Courier detail</h2>
      <p class="sub">Fees include delivery, fuel, GST and WHT on delivered orders, plus fees lost on returns.</p></div>
      <div style="overflow-x:auto;border-top:1px solid var(--ink)"><table style="border-collapse:separate;border-spacing:0;width:100%;font-size:14px"><thead><tr>` +
    [
      "Courier",
      "Delivered",
      "Returned",
      "Return rate",
      "Revenue",
      "Fees",
      "Fees / order",
      "Profit before ads",
      "Margin",
    ]
      .map(
        (l, i) =>
          `<th class="th" scope="col" style="position:${i ? "static" : "sticky"};left:0;z-index:${i ? 0 : 2};text-align:${i ? "right" : "left"}">${l}</th>`,
      )
      .join("") +
    `</tr></thead><tbody>` +
    cs
      .map((c) => {
        const A = c.A;
        return (
          `<tr class="hov"><th class="td" scope="row" style="position:sticky;left:0;z-index:1;text-align:left;font-weight:500">${esc(c.name)}</th>` +
          td(N(A.del)) +
          td(N(A.ret)) +
          td(pct(rr(A))) +
          td(acct(A.cod)) +
          td(acct(chg(A) + A.retLoss)) +
          td(A.del ? "Rs " + N(chg(A) / A.del) : "–") +
          td(acct(c.p), "font-weight:600;color:" + (c.p < 0 ? LOSS : INK)) +
          td(A.cod ? pct(c.p / A.cod) : "–") +
          `</tr>`
        );
      })
      .join("") +
    `</tbody></table></div></section></div>`
  );
}

/* ---------- daily ---------- */
function daily({ st, g, rangeLabel }) {
  const dg = st.dgroup || g;
  const dd = calc(st.from, st.to, dg, false);
  const order = [{ A: dd.tot, l: "Total", s: rangeLabel, tot: true }].concat(
    dd.cols.slice().reverse(),
  );
  const defs = [
    ["Orders delivered", (A) => (A.del ? N(A.del) : "–")],
    ["Revenue", (A) => acct(A.cod)],
    ["Courier fees", (A) => acct(-chg(A))],
    ["COGS", (A) => acct(-A.pc)],
    ["Gross profit", (A) => acct(A.cod - chg(A) - A.pc), "sub"],
    ["Return losses", (A) => acct(-A.retLoss)],
    ["Advertising", (A) => acct(-A.ads)],
    ["Shopify", (A) => acct(-A.shop)],
    ["Net profit", (A) => acct(netOf(A)), "net"],
  ];
  return (
    `<section class="card" style="overflow:hidden">
    <div style="display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;padding:18px 20px 14px">
      <div><h2 class="h2">P&amp;L by period</h2><p class="sub">Newest first. Costs in brackets. Rs.</p></div>
      <div role="group" aria-label="Group by" class="pills">` +
    [
      ["day", "Day"],
      ["week", "Week"],
      ["month", "Month"],
    ]
      .map(([k, l]) =>
        pill(dg === k, "dgroup", k, l, "padding:5px 12px;font-size:13px"),
      )
      .join("") +
    `</div></div>
    <div style="overflow-x:auto;border-top:1px solid var(--ink)"><table style="border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%"><thead><tr>
      <th style="position:sticky;left:0;z-index:2;background:var(--field);text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);min-width:150px"></th>` +
    order
      .map(
        (c) =>
          `<th scope="col" style="text-align:right;padding:10px 14px;border-bottom:1px solid var(--rule);background:${c.tot ? "var(--wash)" : "var(--field)"};font-size:12.5px;font-weight:600;white-space:nowrap;vertical-align:bottom;line-height:1.25">${esc(c.l)}<span style="display:block;font-size:11.5px;font-weight:400;color:var(--mute)">${esc(c.tot ? "" : c.s)}</span></th>`,
      )
      .join("") +
    `</tr></thead><tbody>` +
    defs
      .map(([l, f, kind]) => {
        const bt = kind === "net" ? "1px solid var(--ink)" : "0";
        return (
          `<tr class="hov"><th scope="row" style="position:sticky;left:0;z-index:1;background:var(--field);text-align:left;padding:9px 14px;font-weight:${kind ? 600 : 400};border-top:${bt};border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);white-space:nowrap">${l}</th>` +
          order
            .map(
              (c) =>
                `<td style="text-align:right;padding:9px 14px;white-space:nowrap;border-top:${bt};border-bottom:1px solid var(--rule);background:${c.tot ? "var(--wash)" : "transparent"};font-weight:${c.tot || kind ? 600 : 400};color:${kind === "net" && netOf(c.A) < -0.5 ? LOSS : INK}">${f(c.A)}</td>`,
            )
            .join("") +
          `</tr>`
        );
      })
      .join("") +
    `</tbody></table></div></section>`
  );
}

/* ---------- costs & ads ---------- */
function costs({ st, narrow }) {
  const off = st.loaded ? "" : " disabled";
  const status = (s) =>
    `<span role="status" style="font-size:13px;color:${s && s.err ? LOSS : MUTE}">${s ? esc(s.t) : ""}</span>`;
  const need = st.loaded ? E.needList() : [],
    show = st.needAll ? need : need.slice(0, 6);
  let h =
    `<div style="display:flex;flex-direction:column;gap:14px;margin-top:20px">
    <p style="margin:0;font-size:13px;color:var(--mute)">${st.loaded ? "Changes you save here are saved for everyone who uses this dashboard." : st.loadErr ? "Saved costs could not be loaded, so saving is turned off. Reload the page to try again." : "Loading saved costs…"}</p>
    <section class="card" style="overflow:hidden"><div style="display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;padding:18px 20px 12px">
      <div><h2 class="h2">Products missing a cost</h2><p class="sub">${!st.loaded ? "Waiting for saved costs." : need.length ? "Orders for these products are left out of profit until they have a cost. Enter the cost of one unit and save." : "Every product has a cost. Nothing is waiting."}</p></div>
      <span style="font-size:13px;font-weight:600;color:${need.length ? LOSS : ACC}">${st.loaded ? (need.length ? need.length + " waiting" : "All set") : ""}</span></div>` +
    show
      .map(
        (
          x,
        ) => `<div style="display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 20px;border-top:1px solid var(--rule)">
      <div style="flex:1 1 320px;min-width:0"><div style="font-size:14.5px;font-weight:500;overflow-wrap:anywhere">${esc(x.label)}</div><div style="font-size:12.5px;color:var(--mute);line-height:1.45">${esc(x.desc)}</div>
      <div style="font-size:12.5px;line-height:1.45;margin-top:2px"><b style="font-weight:600;color:var(--loss)">${N(x.waiting)} delivered orders waiting.</b> <span style="color:var(--mute)">${esc(x.hint)}</span></div></div>
      <div style="display:flex;gap:8px;align-items:center"><input type="number" id="nc${x.i}" data-in="nc${x.i}" inputmode="decimal" min="0" step="any" placeholder="Cost in Rs" aria-label="Cost in Rs for ${esc(x.label)}" value="${esc(st.inputs["nc" + x.i] ?? "")}" class="fld" style="width:8rem;text-align:right">
      <button type="button" class="solid" data-act="needSave" data-arg="${x.i}"${off}>Save</button></div></div>`,
      )
      .join("") +
    `<div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--rule)">` +
    (need.length > 6
      ? `<button type="button" class="lnk" data-act="needAll">${st.needAll ? "Show fewer" : "Show all " + need.length}</button>`
      : "<span></span>") +
    status(st.costStatus) +
    `</div></section>`;

  const td = today();
  const icols = narrow
    ? "minmax(0,1fr) 64px 96px"
    : "minmax(0,1fr) 90px 110px 130px";
  h +=
    `<section class="card" style="overflow:hidden"><div style="padding:18px 20px 12px"><h2 class="h2">Unit costs</h2>
    <p class="sub">What one unit costs you. A new cost applies to orders booked from the date you pick, so older orders keep their old cost.</p></div>
    <div class="cap" style="display:grid;grid-template-columns:${icols};gap:0 14px;padding:8px 20px;border-top:1px solid var(--ink)"><span>Item</span><span style="text-align:right">Cost (Rs)</span>${narrow ? "" : `<span style="text-align:right">Since</span>`}<span></span></div>` +
    E.items(td)
      .map((x) => {
        const ed = !!st.editing[x.i],
          since = x.since || "–";
        return (
          `<div style="border-top:1px solid var(--rule)"><div class="hov" style="display:grid;grid-template-columns:${icols};gap:0 14px;align-items:center;padding:11px 20px">
        <div style="min-width:0"><div style="font-size:14px;font-weight:500">${esc(x.label)}</div><div style="font-size:12px;color:var(--mute);line-height:1.4">${esc(x.desc)}${narrow ? (x.desc ? " · " : "") + "Since " + esc(since) : ""}</div></div>
        <span style="text-align:right;font-size:14.5px;color:${x.cost == null ? LOSS : INK}">${x.cost == null ? (st.loaded ? "Not set" : "…") : String(Math.round(x.cost * 100) / 100)}</span>${narrow ? "" : `<span style="text-align:right;font-size:13px;color:var(--mute)">${esc(since)}</span>`}
        <button type="button" class="ghost" data-act="edit" data-arg="${x.i}" aria-expanded="${ed}" style="justify-self:end;padding:4px 10px;font-size:12.5px">Change cost</button></div>` +
          (ed
            ? `<div style="display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;padding:12px 20px 14px;background:var(--wash)">
          <label class="lab">New cost (Rs)<input type="number" id="ev${x.i}" data-in="ev${x.i}" inputmode="decimal" min="0" step="any" value="${esc(st.inputs["ev" + x.i] ?? "")}" class="fld" style="width:8rem;text-align:right;background:var(--field)"></label>
          <label class="lab">From<input type="date" id="ef${x.i}" data-in="ef${x.i}" value="${esc(st.inputs["ef" + x.i] ?? P.iso(td))}" class="fld" style="background:var(--field)"></label>
          <button type="button" class="solid" data-act="editSave" data-arg="${x.i}"${off}>Save</button>
          <button type="button" class="lnk" data-act="cancel" data-arg="${x.i}" style="padding:8px 6px;min-height:36px;font-weight:400">Cancel</button></div>`
            : "") +
          `</div>`
        );
      })
      .join("") +
    `</section>`;

  const acols = narrow
    ? "minmax(0,1fr) 110px"
    : "minmax(0,1fr) 110px 110px 120px";
  h +=
    `<section class="card" style="overflow:hidden"><div style="padding:18px 20px 4px"><h2 class="h2">Ad spend</h2>
    <p class="sub">Enter what you spent on ads for a month or for one day. A month is spread evenly over its days. A day figure replaces that day’s share.</p></div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px 20px 16px">
      <div role="group" aria-label="Ad spend for" class="pills">` +
    [
      ["month", "A month"],
      ["day", "A day"],
    ]
      .map(([k, l]) =>
        pill(st.adKind === k, "adKind", k, l, "font-size:13px;min-height:30px"),
      )
      .join("") +
    `</div>` +
    (st.adKind === "month"
      ? `<label class="lab">Month<input type="month" id="adM" data-in="adM" value="${esc(st.adM)}" class="fld"></label>`
      : `<label class="lab">Day<input type="date" id="adD" data-in="adD" value="${esc(st.adD)}" class="fld"></label>`) +
    `<label class="lab">Amount (Rs)<input type="number" id="adAmt" data-in="adAmt" inputmode="decimal" min="0" step="any" value="${esc(st.adAmt)}" class="fld" style="width:9rem;text-align:right"></label>
      <button type="button" class="solid" data-act="saveAd" style="padding:8px 16px"${off}>Save</button><span style="align-self:center">${status(st.adStatus)}</span></div>
    <div class="cap" style="display:grid;grid-template-columns:${acols};gap:0 14px;padding:8px 20px;border-top:1px solid var(--ink)"><span>Period</span>${narrow ? "" : `<span style="text-align:right">Meta</span><span style="text-align:right">TikTok</span>`}<span style="text-align:right">Total (Rs)</span></div>` +
    E.adList()
      .map((a) => {
        const meta = a.meta != null ? N(a.meta) : "–",
          tt = a.tiktok != null ? N(a.tiktok) : "–";
        return (
          `<div class="hov" style="display:grid;grid-template-columns:${acols};gap:0 14px;padding:10px 20px;border-top:1px solid var(--rule);font-size:14px">
        <span>${esc(a.when)}<span style="color:var(--mute)">${a.month ? " · whole month" : " · one day"}</span>${narrow && (a.meta != null || a.tiktok != null) ? `<span style="display:block;font-size:12px;color:var(--mute)">Meta ${meta} · TikTok ${tt}</span>` : ""}</span>` +
          (narrow
            ? ""
            : `<span style="text-align:right;color:var(--mute)">${meta}</span><span style="text-align:right;color:var(--mute)">${tt}</span>`) +
          `<span style="text-align:right;font-weight:600">${N(a.amount)}</span></div>`
        );
      })
      .join("") +
    `</section></div>`;
  return h;
}

/* ---------- saving and loading (Worker /api/data) ---------- */
let lastJson = "";
function apply(data) {
  const j = JSON.stringify(data);
  S.loaded = true;
  S.loadErr = "";
  if (j === lastJson) return false;
  lastJson = j;
  E.load(data);
  S.ver++;
  return true;
}
/* GitHub Pages copy: numbers are built in; edits are kept in this browser only. */
const SEED = { costs: { "comp:electric": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 1127, from: "2000-01-01" }], key: "comp:electric", label: "Electric pump", src: "seeded from product_costs.json (1 Nov 2026)" }, "comp:hand": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 115, from: "2000-01-01" }], key: "comp:hand", label: "Manual hand pump", src: "seeded from product_costs.json (1 Nov 2026)" }, "comp:jumbo": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 149, from: "2000-01-01" }], key: "comp:jumbo", label: "Jumbo bag (80x100 cm)", src: "seeded from product_costs.json (1 Nov 2026)" }, "comp:large": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 112, from: "2000-01-01" }], key: "comp:large", label: "Large bag (60x80 cm)", src: "seeded from product_costs.json (1 Nov 2026)" }, "comp:medium": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 98, from: "2000-01-01" }], key: "comp:medium", label: "Medium bag (50x70 cm)", src: "seeded from product_costs.json (1 Nov 2026)" }, "comp:shoe": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 45, from: "2000-01-01" }], key: "comp:shoe", label: "Shoe cover", src: "seeded from product_costs.json (1 Nov 2026)" }, "pack:12": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 1596, from: "2000-01-01" }], key: "pack:12", label: "12-bag pack", src: "seeded from product_costs.json (1 Nov 2026)" }, "pack:5": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 729, from: "2000-01-01" }], key: "pack:5", label: "5-bag pack", src: "seeded from product_costs.json (1 Nov 2026)" }, "pack:5jumbo": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 905, from: "2000-01-01" }], key: "pack:5jumbo", label: "5 jumbo bags pack", src: "seeded from product_costs.json (1 Nov 2026)" }, "pack:5large": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 720, from: "2000-01-01" }], key: "pack:5large", label: "5 large bags pack", src: "seeded from product_costs.json (1 Nov 2026)" }, "pack:5medium": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 650, from: "2000-01-01" }], key: "pack:5medium", label: "5 medium bags pack", src: "seeded from product_costs.json (1 Nov 2026)" }, "pack:7": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 976, from: "2000-01-01" }], key: "pack:7", label: "7-bag pack", src: "seeded from product_costs.json (1 Nov 2026)" }, "pack:9": { at: "2026-11-01T12:00:00.000Z", by: null, entries: [{ cost: 1237, from: "2000-01-01" }], key: "pack:9", label: "9-bag pack", src: "seeded from product_costs.json (1 Nov 2026)" } }, adspend: {} };
const LS_KEY = "profit-dashboard-data";
function localData() {
  try { const s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch (_) {}
  return structuredClone(SEED);
}
async function pull() {
  return localData();
}
async function tick() {
  try {
    if (apply(await pull()) || !S.loaded) render();
  } catch (e) {
    if (!S.loaded) {
      S.loadErr = (e && e.message) || "network error";
      render();
    }
  }
}
const busy = new Set();
async function write(coll, id, body) {
  const path = coll + "/" + id;
  if (busy.has(path)) return false;
  busy.add(path);
  try {
    const d = localData();
    d[coll] = d[coll] || {};
    d[coll][id] = body;
    try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (_) {
      throw new Error("this browser blocks saving");
    }
    apply(d);
    return true;
  } finally {
    busy.delete(path);
  }
}
async function saveCost(i, v, from, statusKey, okText, after) {
  const id = E.KEYS[i].id,
    doc = JSON.parse(lastJson || "{}").costs || {},
    prev = (doc[id] && doc[id].entries) || [];
  const entries = prev
    .filter((x) => x.from !== from)
    .concat([{ from, cost: v }])
    .sort((a, b) => (a.from < b.from ? -1 : 1));
  S[statusKey] = { t: "Saving…" };
  render();
  try {
    if (
      await write("costs", id, {
        key: id,
        label: E.KEYS[i].l,
        entries,
        by: "team",
        at: new Date().toISOString(),
      })
    ) {
      after();
      S[statusKey] = { t: okText };
    }
  } catch (e) {
    S[statusKey] = {
      t: "Could not save: " + ((e && e.message) || "try again"),
      err: true,
    };
  }
  render();
}

/* ---------- events ---------- */
const ACTS = {
  tab(k) {
    S.tab = k;
    S.hi = null;
    try {
      history.replaceState(null, "", "#" + k);
    } catch (_) {}
  },
  preset(k) {
    setPreset(k);
  },
  custom() {
    S.customOpen = !S.customOpen;
  },
  line(k) {
    S.open = { ...S.open, [k]: !S.open[k] };
  },
  view(a) {
    const [k, v] = a.split("|");
    S.view = { ...S.view, [k]: v };
  },
  toggleAll() {
    const ks = ["revenue", "fees", "cogs", "returns", "ads", "shop"],
      any = ks.some((k) => !S.open[k]);
    S.open = {};
    ks.forEach((k) => (S.open[k] = any));
  },
  psort(k) {
    S.psort = {
      k,
      dir: S.psort.k === k ? -S.psort.dir : k === "name" ? 1 : -1,
    };
  },
  dgroup(k) {
    S.dgroup = k;
  },
  needAll() {
    S.needAll = !S.needAll;
  },
  edit(i) {
    S.editing = { ...S.editing, [i]: !S.editing[i] };
  },
  cancel(i) {
    S.editing = { ...S.editing, [i]: false };
  },
  adKind(k) {
    S.adKind = k;
  },
  needSave(i) {
    i = +i;
    const v = parseFloat(S.inputs["nc" + i]),
      lbl = E.KEYS[i].l;
    if (!isFinite(v) || v < 0) {
      S.costStatus = {
        t: "Enter a cost of 0 or more for " + lbl + ".",
        err: true,
      };
      return;
    }
    saveCost(
      i,
      v,
      "2000-01-01",
      "costStatus",
      "Saved " + lbl + ": Rs " + v + ". Profit is updated for everyone.",
      () => {
        S.inputs["nc" + i] = "";
      },
    );
    return true;
  },
  editSave(i) {
    i = +i;
    const v = parseFloat(S.inputs["ev" + i]),
      from = S.inputs["ef" + i] || P.iso(today()),
      lbl = E.KEYS[i].l;
    if (!isFinite(v) || v < 0) {
      S.costStatus = { t: "Enter a cost of 0 or more.", err: true };
      return;
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(from)) {
      S.costStatus = { t: "Pick the date the new cost starts.", err: true };
      return;
    }
    saveCost(
      i,
      v,
      from,
      "costStatus",
      "Saved " +
        lbl +
        ": Rs " +
        v +
        " from " +
        P.fmtDY(P.dnum(from)) +
        ". Profit is updated for everyone.",
      () => {
        S.editing = { ...S.editing, [i]: false };
        S.inputs["ev" + i] = "";
      },
    );
    return true;
  },
  saveAd() {
    const period = S.adKind === "month" ? S.adM : S.adD,
      amt = parseFloat(S.adAmt);
    if (!period) {
      S.adStatus = {
        t: "Pick a " + (S.adKind === "month" ? "month" : "day") + ".",
        err: true,
      };
      return;
    }
    if (!isFinite(amt) || amt < 0) {
      S.adStatus = { t: "Enter an amount of 0 or more.", err: true };
      return;
    }
    S.adStatus = { t: "Saving…" };
    render();
    write("adspend", period, {
      period,
      amount: amt,
      by: "team",
      at: new Date().toISOString(),
    })
      .then((ok) => {
        if (ok) {
          S.adAmt = "";
          S.adStatus = {
            t:
              "Saved Rs " +
              amt.toLocaleString("en-US") +
              " for " +
              period +
              ". Profit is updated for everyone.",
          };
        }
      })
      .catch((e) => {
        S.adStatus = {
          t: "Could not save: " + ((e && e.message) || "try again"),
          err: true,
        };
      })
      .then(render);
    return true;
  },
};
app.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled || !app.contains(b)) return;
  if (!ACTS[b.dataset.act](b.dataset.arg)) render();
});
app.addEventListener("keydown", (e) => {
  const b = e.target.closest("[data-act][tabindex]");
  if (b && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    b.click();
  }
});
const onField = (e) => {
  const t = e.target;
  if (t.dataset.in) {
    const k = t.dataset.in;
    if (k === "adM" || k === "adD" || k === "adAmt") S[k] = t.value;
    else S.inputs[k] = t.value;
  } else if (t.dataset.date && e.type === "change") {
    setCustom(t.dataset.date, t.value);
    render();
  }
};
app.addEventListener("input", onField);
app.addEventListener("change", onField);
app.addEventListener("mouseover", (e) => {
  const b = e.target.closest(".bar");
  if (b) hover(+b.dataset.bar);
});
app.addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".bar");
  if (b) hover(+b.dataset.bar);
});
app.addEventListener("mouseout", (e) => {
  const t = document.getElementById("trend");
  if (t && t.contains(e.target) && !t.contains(e.relatedTarget)) hover(null);
});

const readHash = () => {
  const k = (location.hash || "").slice(1);
  if (TABS.some((t) => t[0] === k)) {
    S.tab = k;
    S.hi = null;
    return true;
  }
};
window.addEventListener("hashchange", () => {
  if (readHash()) render();
});
const onResize = () => {
  const n = window.innerWidth < 720;
  if (n !== S.narrow) {
    S.narrow = n;
    render();
  }
};
window.addEventListener("resize", onResize);

/* ---------- boot ---------- */
readHash();
S.narrow = window.innerWidth < 720;
setPreset("l30");
render();
setTimeout(() => {
  if (!S.loaded && !S.loadErr) {
    S.slow = true;
    render();
  }
}, 10000);
tick();
setInterval(() => document.visibilityState === "visible" && tick(), 20000);

      })();
    </script>
